<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro de Facturas</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background-color: #fdfdf5; }
        header { background-color: #ADD8E6; padding: 20px; text-align: center; }
        
        .menu-interno { 
            background-color: #e8f4f8; 
            padding: 15px; 
            text-align: center; 
            border-bottom: 1px solid #ccc;
        }
        .btn-salto {
            text-decoration: none;
            background-color: #2e7d32;
            color: white;
            padding: 10px 20px;
            margin: 0 10px;
            font-size: 0.9em;
            border-radius: 4px;
        }

        /* --- DISEÑO DE DOS COLUMNAS (GRID) --- */
        .workspace {
            display: grid;
            grid-template-columns: 350px 1fr; /* Izquierda: formulario fijo, Derecha: tabla */
            gap: 25px;
            padding: 20px;
            max-width: 1400px;
            margin: auto;
        }

        /* --- ESTILOS DEL FORMULARIO --- */
        .form-sidebar {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
            border-top: 4px solid #2e7d32;
            height: fit-content;
            position: sticky;
            top: 20px;
        }
        .form-sidebar h3 {
            margin-top: 0;
            color: #2c3e50;
            border-bottom: 2px solid #90EE90;
            padding-bottom: 8px;
        }
        .form-group {
            margin-bottom: 12px;
        }
        .form-group label {
            display: block;
            font-size: 0.85em;
            font-weight: bold;
            color: #444;
            margin-bottom: 4px;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .btn-submit {
            width: 100%;
            background-color: #2e7d32;
            color: white;
            border: none;
            padding: 12px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            margin-top: 10px;
        }
        .btn-submit:hover {
            background-color: #1b5e20;
        }

        /* --- ESTILOS DE LA TABLA --- */
        .data-content { 
            display: flex;
            flex-direction: column;
        }
        h2 { color: #2c3e50; border-bottom: 2px solid #2e7d32; margin-top: 0; padding-top: 10px; }

        table { width: 100%; border-collapse: collapse; background: white; margin-bottom: 40px; font-size: 0.9em; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background-color: #90EE90; color: #1b5e20; }

        footer { text-align: center; padding: 40px; background: #d1f2d1; margin-top: 50px; }
    </style>
</head>
<body>

    <header>
        <h1>MediConnect</h1>
        <p>Listado Oficial de Facturas</p>
    </header>

    <div class="menu-interno">
        <a href="index.html" class="btn-salto">Cerrar Tabla y Volver</a>
    </div>

    <!-- Contenedor Principal en Grid -->
    <div class="workspace">
        
        <!-- COLUMNA IZQUIERDA: Formulario de Registro -->
        <aside class="form-sidebar">
            <h3>Nueva Factura</h3>
            <form id="facturaForm">
                <div class="form-group">
                    <label for="id_pago">ID Pago:</label>
                    <input type="number" id="id_pago" required>
                </div>
                <div class="form-group">
                    <label for="id_cita">ID Cita:</label>
                    <input type="number" id="id_cita" required>
                </div>
                <div class="form-group">
                    <label for="metodo_pago">Método de Pago:</label>
                    <select id="metodo_pago" required>
                        <option value="Efectivo">Efectivo</option>
                        <option value="Tarjeta">Tarjeta</option>
                        <option value="Transferencia">Transferencia</option>
                        <option value="N/A">N/A</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="total">Monto Total ($):</label>
                    <input type="number" id="total" step="0.01" placeholder="Ej. 500" required>
                </div>

                <button type="submit" class="btn-submit">Guardar Registro</button>
            </form>
        </aside>

        <!-- COLUMNA DERECHA: Tabla Vacía -->
        <main class="data-content">
            <h2>Facturas Registradas</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID pago</th>
                        <th>ID cita</th>
                        <th>Método pago</th>
                        <th>Subtotal</th>
                        <th>IVA</th>
                        <th>Total</th>
                    </tr>
                </thead>
                <tbody id="tabla-facturas">
                    <!-- Los datos se insertarán aquí dinámicamente -->
                </tbody>
            </table>
        </main>
    </div>

    <footer>
        Martinez Ortiz Indra Jezabel | Grupo: J | 2026
    </footer>

    <!-- Script de Automatización Local -->
    <script>
        document.getElementById('facturaForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const idPago = document.getElementById('id_pago').value;
            const idCita = document.getElementById('id_cita').value;
            const metodoPago = document.getElementById('metodo_pago').value;
            const totalNum = parseFloat(document.getElementById('total').value);

            let subtotal = 0;
            let iva = 0;
            let totalDisplay = totalNum;

            // Calcular desglose matemático si el total es mayor a 0
            if (totalNum > 0) {
                subtotal = (totalNum / 1.16).toFixed(2);
                iva = (totalNum - subtotal).toFixed(2);
            } else {
                subtotal = "0";
                iva = "0";
                totalDisplay = "0";
            }

            const tbody = document.getElementById('tabla-facturas');
            const nuevaFila = document.createElement('tr');

            nuevaFila.innerHTML = `
                <td>${idPago}</td>
                <td>${idCita}</td>
                <td>${metodoPago}</td>
                <td>${subtotal}</td>
                <td>${iva}</td>
                <td>${totalDisplay}</td>
            `;

            tbody.appendChild(nuevaFila);
            this.reset();
        });
    </script>

</body>
</html>
