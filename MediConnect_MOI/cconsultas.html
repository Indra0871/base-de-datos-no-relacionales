<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro de Consultas</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background-color: #fdfdf5; }
        header { background-color: #ADD8E6; padding: 20px; text-align: center; }
        
        .menu-interno { 
            background-color: #e8f4f8; 
            padding: 15px; 
            text-align: center; 
            border-bottom: 1px solid #ccc;
        }
        .btn-salto {
            text-decoration: none;
            background-color: #2e7d32;
            color: white;
            padding: 10px 20px;
            margin: 0 10px;
            font-size: 0.9em;
            border-radius: 4px;
        }

        /* --- DISEÑO DE DOS COLUMNAS (GRID) --- */
        .workspace {
            display: grid;
            grid-template-columns: 350px 1fr; /* Izquierda: formulario fijo, Derecha: tabla */
            gap: 25px;
            padding: 20px;
            max-width: 1400px;
            margin: auto;
        }

        /* --- ESTILOS DEL FORMULARIO --- */
        .form-sidebar {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
            border-top: 4px solid #2e7d32;
            height: fit-content;
            position: sticky;
            top: 20px;
        }
        .form-sidebar h3 {
            margin-top: 0;
            color: #2c3e50;
            border-bottom: 2px solid #90EE90;
            padding-bottom: 8px;
        }
        .form-group {
            margin-bottom: 12px;
        }
        .form-group label {
            display: block;
            font-size: 0.85em;
            font-weight: bold;
            color: #444;
            margin-bottom: 4px;
        }
        .form-group input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .btn-submit {
            width: 100%;
            background-color: #2e7d32;
            color: white;
            border: none;
            padding: 12px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            margin-top: 10px;
        }
        .btn-submit:hover {
            background-color: #1b5e20;
        }

        /* --- ESTILOS DE LA TABLA --- */
        .data-content { 
            display: flex;
            flex-direction: column;
        }
        h2 { color: #2c3e50; border-bottom: 2px solid #2e7d32; margin-top: 0; padding-top: 10px; }

        table { width: 100%; border-collapse: collapse; background: white; margin-bottom: 40px; font-size: 0.9em; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background-color: #90EE90; color: #1b5e20; }

        footer { text-align: center; padding: 40px; background: #d1f2d1; margin-top: 50px; }
    </style>
</head>
<body>

    <header>
        <h1>MediConnect</h1>
        <p>Listado Oficial de Consultas</p>
    </header>

    <div class="menu-interno">
        <a href="index.html" class="btn-salto">Cerrar Tabla y Volver</a>
    </div>

    <!-- Contenedor Principal en Grid -->
    <div class="workspace">
        
        <!-- COLUMNA IZQUIERDA: Formulario de Registro -->
        <aside class="form-sidebar">
            <h3>Nueva Consulta</h3>
            <form id="consultaForm">
                <div class="form-group">
                    <label for="id">ID Consulta:</label>
                    <input type="number" id="id" required>
                </div>
                <div class="form-group">
                    <label for="id_cita">ID Cita:</label>
                    <input type="number" id="id_cita" required>
                </div>
                <div class="form-group">
                    <label for="peso">Peso (kg):</label>
                    <input type="number" id="peso" step="0.1" placeholder="Ej. 70.5" required>
                </div>
                <div class="form-group">
                    <label for="temperatura">Temperatura (°C):</label>
                    <input type="number" id="temperatura" step="0.1" placeholder="Ej. 36.5" required>
                </div>
                <div class="form-group">
                    <label for="presion">Presión Arterial:</label>
                    <input type="text" id="presion" placeholder="Ej. 120/80" required>
                </div>
                <div class="form-group">
                    <label for="diagnostico">Diagnóstico:</label>
                    <input type="text" id="diagnostico" required>
                </div>
                <div class="form-group">
                    <label for="paciente">Paciente:</label>
                    <input type="text" id="paciente" required>
                </div>

                <button type="submit" class="btn-submit">Guardar Registro</button>
            </form>
        </aside>

        <!-- COLUMNA DERECHA: Tabla Vacía -->
        <main class="data-content">
            <h2>Consultas Registradas</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>ID Cita</th>
                        <th>Peso kg</th>
                        <th>Temperatura</th>
                        <th>Presión</th>
                        <th>Diagnóstico</th>
                        <th>Paciente</th>
                    </tr>
                </thead>
                <tbody id="tabla-consultas">
                    <!-- Los datos se insertarán aquí dinámicamente -->
                </tbody>
            </table>
        </main>
    </div>

    <footer>
        Martinez Ortiz Indra Jezabel | Grupo: J | 2026
    </footer>

    <!-- Script de Automatización Local -->
    <script>
        document.getElementById('consultaForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const id = document.getElementById('id').value;
            const id_cita = document.getElementById('id_cita').value;
            const peso = document.getElementById('peso').value;
            const temperatura = document.getElementById('temperatura').value;
            const presion = document.getElementById('presion').value;
            const diagnostico = document.getElementById('diagnostico').value;
            const paciente = document.getElementById('paciente').value;

            const tbody = document.getElementById('tabla-consultas');
            const nuevaFila = document.createElement('tr');

            nuevaFila.innerHTML = `
                <td>${id}</td>
                <td>${id_cita}</td>
                <td>${peso}</td>
                <td>${temperatura}</td>
                <td>${presion}</td>
                <td>${diagnostico}</td>
                <td>${paciente}</td>
            `;

            tbody.appendChild(nuevaFila);
            this.reset();
        });
    </script>

</body>
</html>
